<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--f:#09251B;--e:#087F5B;--l:#C8FF63;--m:#A7F3D0;--v:#B8A3FF;--c:#FF9278;--s:#83D9FF;--cr:#FAF8EF;--t:#14251D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:400 15px/1.5 Inter,system-ui,sans-serif;background:var(--cr);color:var(--t)}
h1,h2,h3,.sg{font-family:'Space Grotesk',system-ui,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:99px;padding:10px 18px;font-weight:600;background:var(--f);color:var(--l);transition:transform .15s}
button:hover{transform:translateY(-1px)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--v);outline-offset:2px}
button.g{background:#fff;color:var(--t);border:1.5px solid #cfd8cf}button.l{background:var(--l);color:var(--f)}button.sm{padding:6px 12px;font-size:13px}
input,select,textarea{width:100%;padding:11px 14px;border-radius:14px;border:1.5px solid #cfd8cf;background:#fff;margin:4px 0 10px}
label{font-weight:600;font-size:13px}.err{color:#b3261e;font-size:13px;margin:-6px 0 8px}
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;background:radial-gradient(circle at 30% 40%,#0d4a35,var(--f) 60%);color:#fff;overflow:hidden}
.art{display:flex;flex-direction:column;justify-content:center;padding:48px;position:relative}
.art h1{font-size:clamp(44px,7vw,92px);letter-spacing:-.03em}.art p{max-width:420px;color:var(--m)}
.loop{width:min(300px,60vw);height:min(300px,60vw);margin:10px 0 20px}.loop .o{transform-origin:150px 150px;animation:sp 14s linear infinite}.loop .p{animation:pl 4s ease-in-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes pl{50%{opacity:.6}}
.panel{background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:28px;padding:28px;margin:auto;width:min(440px,92%)}
.panel input{background:#fff;color:var(--t)}.panel label{color:var(--m)}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{flex:1;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.3)}.tabs button.on{background:var(--l);color:var(--f)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav.sb{background:var(--f);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav.sb button{background:transparent;color:#cfe;text-align:left;border-radius:14px;width:100%;font-weight:500}
nav.sb button.on{background:rgba(200,255,99,.15);color:var(--l);box-shadow:0 0 22px rgba(200,255,99,.25)}
main{padding:20px clamp(16px,3vw,36px) 90px;min-width:0}
.top{display:flex;gap:10px;align-items:center;margin-bottom:22px;flex-wrap:wrap}.top input{flex:1;min-width:140px;margin:0}
.chip{background:var(--m);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.demo{background:var(--v);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
h2{font-size:clamp(28px,4vw,44px);letter-spacing:-.02em;margin-bottom:6px}.sub{color:#4b5f55;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.list{display:grid;gap:12px}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 1px 2px #0001,0 10px 30px -14px #09251b55;transition:transform .2s,box-shadow .2s}
.card.h:hover{transform:translateY(-4px);box-shadow:0 18px 40px -12px #087f5b88}
.art2{height:92px;border-radius:16px;display:grid;place-items:center;font-size:44px;margin-bottom:10px}
.big{font-size:38px;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{background:#eef3ec;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.bar{height:10px;background:#e4ebe2;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--e),var(--l));border-radius:9px;transition:width .8s}
.act{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:20px 0}.act .card{cursor:pointer;color:var(--f)}
.mo{position:fixed;inset:0;background:#09251bcc;display:grid;place-items:center;z-index:50;padding:16px}.mo>div{background:var(--cr);border-radius:26px;padding:24px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.drop{border:2.5px dashed var(--e);border-radius:24px;padding:30px;text-align:center;background:#fff}
.ring{position:relative;display:inline-block}.ring.sc:after{content:"";position:absolute;inset:-8px;border:3px solid var(--l);border-radius:20px;animation:rg 1s ease-out infinite}
@keyframes rg{from{transform:scale(.9);opacity:1}to{transform:scale(1.15);opacity:0}}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:4px}
.b{padding:10px 14px;border-radius:18px;max-width:88%}.b.u{background:var(--f);color:#fff;align-self:flex-end}.b.a{background:var(--m);align-self:flex-start}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.path{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}
.bn{display:none}.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--f);color:var(--l);padding:10px 18px;border-radius:99px;z-index:99;font-weight:600}
.cf{position:fixed;top:-10px;width:9px;height:14px;z-index:99;animation:fall 1.6s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:0}}
.sk{background:linear-gradient(90deg,#e4ebe2,#f3f6f1,#e4ebe2);background-size:200%;animation:sh 1s infinite;height:90px;border-radius:18px}@keyframes sh{to{background-position:-200%}}
@media(max-width:820px){#login{grid-template-columns:1fr}.art{padding:24px 20px 0}.art .loop{width:130px;height:130px}.art h1{font-size:44px}
.app{grid-template-columns:1fr}nav.sb{display:none}.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--f);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;gap:2px}
.bn button{background:transparent;color:#cfe;font-size:11px;padding:6px 10px;border-radius:12px;white-space:nowrap}.bn button.on{background:rgba(200,255,99,.2);color:var(--l)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function logo(sz=300){return `<img src="${sz<=120?LG_C:LG_S}" alt="EcoLoop AI logo" class="loop" style="width:${sz}px;max-width:100%;height:auto;object-fit:contain">`}
function logoSvg(sz=300){return `<svg class="loop" viewBox="0 0 300 300" style="width:${sz}px;height:${sz}px"><defs><radialGradient id="pg"><stop offset="0" stop-color="#C8FF63"/><stop offset="1" stop-color="#087F5B"/></radialGradient></defs><circle cx="150" cy="150" r="118" fill="none" stroke="#C8FF63" stroke-opacity=".35" stroke-width="3"/><circle cx="150" cy="150" r="50" fill="url(#pg)" class="p"/><g class="o"><circle cx="150" cy="32" r="9" fill="#FF9278"/><circle cx="268" cy="150" r="7" fill="#B8A3FF"/><circle cx="150" cy="268" r="9" fill="#83D9FF"/><circle cx="32" cy="150" r="6" fill="#A7F3D0"/></g></svg>`}
/* matching: transparent rule-based score (max 100) */
function score(w,l){if(!av(l))return null;l={...l,qty:l.qty-(l.res||0)};let s=0,r=[],lim=[];
if(l.cat===w.cat){s+=40;r.push('Category matches')}else return null;
const k=w.kw.toLowerCase().split(/\s+/);if(k.some(x=>x.length>2&&l.name.toLowerCase().includes(x))){s+=15;r.push('Item name matches the request')}
if(l.qty>=w.qty){s+=25;r.push(`Quantity suitable (${l.qty} ${l.unit} vs ${w.qty} needed)`)}else{s+=Math.round(25*l.qty/w.qty);lim.push(`Only ${l.qty} of ${w.qty} needed`)}
if(w.area&&l.area===w.area){s+=15;r.push('Same area')}else lim.push('Different or unknown area');
if(['New','Good'].includes(l.cond)){s+=10;r.push('Condition good')}else lim.push(`Condition: ${l.cond}`);
return{s,r,lim}}
function matches(w){return S.L.filter(l=>!l.mine).map(l=>({l,...score(w,l)||{s:-1}})).filter(m=>m.s>=0).sort((a,b)=>b.s-a.s)}
function go(p){S.page=p;draw()}
function modal(h){const m=document.createElement('div');m.className='mo';m.innerHTML=`<div>${h}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.append(m);return m}
const cls=()=>document.querySelector('.mo')?.remove();
/* LOGIN */
function login(){R().innerHTML=`<div id="login"><div class="art">${logo()}<h1 class="sg">ECOLOOP AI</h1><h3 style="font-size:24px;margin:10px 0">Give waste a second life.</h3><p>Discover unused resources. Find their next home. Build a circular future.</p><p style="font-size:12px;opacity:.7;margin-top:30px">Built with purpose by Team 404 AURA.</p></div>
<div style="display:grid;align-items:center;padding:16px"><div class="panel"><div class="tabs"><button class="${S.tab=='login'?'on':''}" onclick="S.tab='login';login()">Log in</button><button class="${S.tab=='reg'?'on':''}" onclick="S.tab='reg';login()">Create account</button></div>
<form id="af" onsubmit="return auth(event)" novalidate>${S.tab=='reg'?'<label>Full name</label><input id="an" autocomplete="name"><div class="err" id="e1"></div>':''}<label>Email</label><input id="ae" type="email" autocomplete="email"><div class="err" id="e2"></div><label>Password</label><div style="position:relative"><input id="ap" type="password" autocomplete="${S.tab=='reg'?'new-password':'current-password'}"><button type="button" class="sm g" style="position:absolute;right:6px;top:8px" onclick="let p=$('#ap');p.type=p.type=='password'?'text':'password'">Show</button></div><div class="err" id="e3"></div>
${S.tab=='reg'?'<label>Confirm password</label><input id="ac" type="password"><div class="err" id="e4"></div>':'<div class="row" style="justify-content:space-between;margin-bottom:12px"><label><input type="checkbox" style="width:auto;margin:0 6px 0 0">Remember me</label><a href="#" style="color:var(--l)" onclick="forgot();return false">Forgot password?</a></div>'}
<button class="l" style="width:100%">${S.tab=='reg'?'Create account':'Log in'}</button></form>
<p style="font-size:12px;color:var(--m);margin:12px 0">Supabase isn’t configured in this build, so real accounts can’t be created. Submitting the form starts a clearly labelled demo session; passwords are never stored.</p>

S.sv=[];S.sh=[];S.rep=[];S.sav=[];
const av=l=>l.st==='available'&&(!l.exp||l.exp>=D(0))&&l.qty-(l.res||0)>0;
function sv(i){const k=S.sv.indexOf(i);k<0?S.sv.push(i):S.sv.splice(k,1);document.querySelector('.mo')?toast('Saved list updated'):draw()}
function rep(i){if(confirm('Report this listing? Demo: stored in this session only, no moderator is connected.')){S.rep.push(i);toast('Report recorded (demo)')}}
function pass(l){const ex=S.R.filter(r=>r.lid==l.id&&r.st=='completed'),o=l.qty+ex.reduce((a,r)=>a+r.qty,0);return `<div class="card" style="background:#eef3ec;padding:12px"><b>Resource passport EC-${l.id}</b><br>Original ${o} · remaining ${l.qty} · reserved ${l.res||0} ${l.unit}<br>Listed ${l.date} · ${ex.length} completed exchange(s)<br><span style="font-size:12px">QR codes aren’t implemented yet.</span></div>`}
function rescue(w){const same=S.L.filter(l=>l.cat==w.cat&&!l.mine),why=!same.length?`No ${w.cat.toLowerCase()} listings exist.`:`${same.length} ${w.cat.toLowerCase()} listing(s) exist, but none is currently available or all were dismissed.`;return `<div class="card"><b>No-Match Rescue</b><p>${why} No recipient or listing is invented.</p><p>Try a lower quantity, a wider area, “Fair” condition, or a related category.</p><button class="sm" onclick="S.sav.push(${w.id});toast('Search saved (demo: no alerts are sent)');go('match')">${S.sav.includes(w.id)?'Saved ✓':'Save this search'}</button></div>`}
function cbtn(r){const me=r.inc?'oc':'rc',ot=r.inc?'rc':'oc',o=r.inc?'recipient':'owner';return `<span class="tag">${!r[me]&&!r[ot]?'Awaiting both confirmations':r[me]?'Awaiting '+o+' confirmation':'Awaiting your confirmation'}</span>${r[me]?'':`<button class="sm" onclick="conf(${r.id},'${me}')">I confirm the exchange happened</button>`}${r[ot]?'':`<button class="g sm" onclick="conf(${r.id},'${ot}')">Simulate ${o} confirming (demo)</button>`}`}
function conf(i,k){const r=S.R.find(x=>x.id==i);if(r.st!=='accepted'||r[k])return;r[k]=Date.now();S.act.unshift({t:'Confirmation recorded ('+(k=='oc'?'owner':'recipient')+')'});if(r.oc&&r.rc)fin(r);draw()}
function fin(r){const l=S.L.find(x=>x.id==r.lid);if(r.st=='completed')return;r.st='completed';r.done=Date.now();l.qty-=r.qty;l.res-=r.qty;if(l.qty<=0)l.st='completed';S.X.push({name:l.name,cat:l.cat,qty:r.qty,unit:l.unit,m:new Date().getMonth(),pid:'EX-'+r.id});award('x'+r.id,25,'verified exchange: '+l.name);S.act.unshift({t:`Exchange completed: ${r.qty} ${l.unit} ${l.name}`});S.ntf.push({t:'Exchange completed: '+l.name,r:0});confetti()}
/* scanner */
function pick(f){if(!f)return;const e=$('#fe');if(!['image/jpeg','image/png','image/webp'].includes(f.type)){e.textContent='Use a JPEG, PNG or WebP image.';return}if(f.size>5e6){e.textContent='Image must be under 5 MB.';return}const r=new FileReader();r.onload=()=>{S.scan={...(S.scan||{}),img:r.result,name:f.name};draw()};r.readAsDataURL(f)}
function analyse(){const s=S.scan||(S.scan={});s.d=$('#sd').value;s.c=$('#sc').value;s.q=+$('#sq').value||1;const txt=((s.d||'')+' '+(s.name||'')).toLowerCase();
const K={Cardboard:'box carton cardboard',Containers:'jar bottle container tub',Decorations:'decor banner balloon bunting',Stationery:'pen notebook paper stationery book',Textiles:'cloth shirt fabric bag cotton',Electronics:'monitor phone cable laptop keyboard',Furniture:'chair table desk shelf'};
s.busy=1;draw();setTimeout(()=>{s.busy=0;s.res={cat:CATS.find(c=>K[c].split(' ').some(k=>txt.includes(k)))||'Cardboard'};S.sh.unshift({cat:s.res.cat,d:s.d||'(no description)',q:s.q,t:new Date().toLocaleTimeString()});draw()},700)}
function scanList(){const s=S.scan;s.res.cat=$('#rc').value;wiz(0,{name:(s.d||s.res.cat+' items'),cat:s.res.cat,qty:s.q,cond:s.c})}
function draft(){const s=S.scan;S.L.push({id:++id,name:s.d||s.res.cat+' items',cat:$('#rc').value,qty:s.q,unit:'pcs',cond:s.c,area:'Demo Campus',type:'Free',st:'draft',owner:'You',mine:1,date:D(0)});toast('Draft saved in My Listings')}
/* wizard */
let WZ;function wiz(i,pre){cls();const l=i?S.L.find(x=>x.id==i):null;WZ={step:0,id:i,d:l?{...l}:{name:'',cat:'Cardboard',qty:1,unit:'pcs',cond:'Good',area:'',type:'Free',desc:'',...pre}};wzr()}
function wzr(){cls();const d=WZ.d,st=WZ.step,T=['Photo (optional)','Item details','Quantity and condition','Area and collection','Offer type','Preview and publish'];
const F=[`<p>Photos help. In this demo they stay in your browser and aren’t uploaded.</p>`,`<label>Item name</label><input id="w0" value="${esc(d.name)}"><label>Category</label><select id="w1">${CATS.map(c=>`<option ${d.cat==c?'selected':''}>${c}</option>`).join('')}</select><label>Description</label><textarea id="w2">${esc(d.desc)}</textarea>`,`<div class="row"><input id="w3" type="number" min="1" style="flex:1" value="${d.qty}"><select id="w4" style="flex:1">${['pcs','kg','sets','boxes'].map(c=>`<option ${d.unit==c?'selected':''}>${c}</option>`).join('')}</select></div><label>Condition</label><select id="w5">${['New','Good','Fair','Needs repair'].map(c=>`<option ${d.cond==c?'selected':''}>${c}</option>`).join('')}</select>`,`<label>Approximate area (no exact addresses)</label><input id="w6" value="${esc(d.area)}"><label>Expiry date (optional)</label><input id="w8" type="date" value="${d.exp||''}"><div class="err" id="we"></div>`,`<label>Offer type</label><select id="w7">${['Free','Exchange','Sale'].map(c=>`<option ${d.type==c?'selected':''}>${c}</option>`).join('')}</select>`,`<p><b>${IC[d.cat]} ${esc(d.name)}</b><br>${d.qty} ${d.unit} · ${d.cond} · ${d.type} · ${esc(d.area)}</p>`];
const m=modal(`<h3>${T[st]} <span class="tag">${st+1}/6</span></h3>${F[st]}<div class="row" style="margin-top:12px">${st?'<button class="g" id="wb">Back</button>':''}<button id="wn">${st==5?'Publish':'Next'}</button>${st==5?'<button class="g" id="wd">Save draft</button>':''}</div>`);
const sv=()=>{const g=k=>document.getElementById(k);if(st==1){d.name=g('w0').value.trim();d.cat=g('w1').value;d.desc=g('w2').value}if(st==2){d.qty=+g('w3').value;d.unit=g('w4').value;d.cond=g('w5').value}if(st==3){d.area=g('w6').value.trim();d.exp=g('w8').value}if(st==4)d.type=g('w7').value};
const fin=s=>{const o={...d,st:s,owner:'You',mine:1,date:D(0)};if(WZ.id)Object.assign(S.L.find(x=>x.id==WZ.id),o);else{o.id=++id;S.L.push(o)}if(s=='available'){award('l'+(WZ.id||o.id),5,'published '+d.name);S.act.unshift({t:`Listing published: ${d.name}`});confetti()}cls();S.page='market';draw()};
$('#wn').onclick=()=>{sv();if(st==1&&!d.name){return toast('Item name is required')}if(st==2&&(!(d.qty>0)||d.qty<(d.res||0)))return toast('Quantity must be above 0 and cover reserved stock');if(st==3&&!d.area){$('#we').textContent='Add an approximate area';return}if(st==5)return fin('available');WZ.step++;wzr()};
if($('#wb'))$('#wb').onclick=()=>{sv();WZ.step--;wzr()};if($('#wd'))$('#wd').onclick=()=>fin('draft')}
/* agent */
function ask(p){const i=$('#ai'),t=(p||i.value).trim();if(!t)return;S.chat.push({t});const lw=t.toLowerCase(),cat=CATS.find(c=>({Cardboard:'box carton cardboard',Containers:'jar container bottle',Decorations:'decor banner balloon',Stationery:'stationery pen notebook office paper',Textiles:'cloth fabric shirt bag',Electronics:'electronic monitor phone',Furniture:'chair table furniture'}[c]).split(' ').some(k=>lw.includes(k)));const q=+(lw.match(/\d+/)||[1])[0];
if(/nobody|no one/.test(lw))S.chat.push({a:1,t:'If nobody wants it: widen the area, switch to Free, try a different recipient type such as schools or maker spaces, then check local recycling or disposal options. I can’t confirm local rules from here.'});
else if(!cat)S.chat.push({a:1,t:'Which kind of item is it? I know cardboard, containers, decorations, stationery, textiles, electronics and furniture. Add a quantity if you can.'});
else{const ms=matches({kw:lw,cat,qty:q,area:'Demo Campus'}).slice(0,2);S.chat.push({a:1,h:`<b>Reuse ideas for ${IC[cat]} ${cat}:</b> ${IDEAS[cat].join(' · ')}.<br><br><b>Matches from this app’s data:</b> ${ms.length?ms.map(m=>`${esc(m.l.name)} (${m.s}/100 estimate)`).join('; ')+' (these are listings by others, not people asking for yours)':'none right now'}.<br><br><b>Draft offer (not sent):</b> “Hi! I have ${q} ${cat.toLowerCase()} items to pass on. Could your team use them? Collection can be arranged this week.”<br><div class="row" style="margin-top:8px"><button class="sm" onclick="wiz(0,{name:'${q} ${cat.toLowerCase()} items',cat:'${cat}',qty:${q}})">Create listing</button><button class="g sm" onclick="agentOffer(${ms[0]?.l.id||0})">Review offer</button></div>`})}
draw();const c=$('#ch');if(c)c.scrollTop=1e9}
function agentOffer(i){if(!i)return toast('No listing to send an offer to');const l=S.L.find(x=>x.id==i);modal(`<h3>Review offer</h3><p>The agent will send a request for <b>${esc(l.name)}</b> only after you approve.</p><div class="row"><button onclick="sendR(${i},'Hi! We’d love to reuse these. Could we arrange collection this week?')">Approve and send</button><button class="g" onclick="cls()">Cancel</button></div>`)}
login();
</script></body></html>
